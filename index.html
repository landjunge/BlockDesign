<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlockDesigner</title>
  <link rel="stylesheet" href="/styles/networkpunkt.css"><link rel="stylesheet" href="/styles/blockdesigner.css">
</head>
<body class="np-ui np-scroll">
<div class="app np-desktop">
  <header class="topbar np-scroll" aria-label="BlockDesigner Header" tabindex="0">
    <h1>Block<span class="brand">Designer</span></h1>
    <button class="np-button" id="toggle-myspace" aria-controls="myspace" data-i18n="myspace"></button>
    <div id="layers" class="header-group" role="group" aria-label="Ebenen / Layers"><button class="np-button" data-layer="1">1</button><button class="np-button" data-layer="2">2</button><button class="np-button" data-layer="3">3</button></div>
    <div class="header-group" role="group" aria-label="Ansicht / View"><button class="np-button" data-view="structure" data-i18n="structure"></button><button class="np-button" data-view="design" data-i18n="design"></button></div>
    <div class="header-group"><button id="grid-toggle" class="np-button" data-i18n="grid"></button><button id="refine" class="np-button" data-i18n="refine"></button><span id="grid-info" class="np-meta"></span><button id="coarsen" class="np-button" data-i18n="coarsen"></button></div>
    <label class="np-field zoom"><span class="sr-only" data-i18n="zoom"></span><select id="zoom"><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
    <button id="undo" class="np-button" data-i18n="undo"></button><button id="redo" class="np-button" data-i18n="redo"></button>
    <nav class="header-group" aria-label="Sprache / Language"><button class="np-button" data-language="de">DE</button><button class="np-button" data-language="en">EN</button></nav>
    <button class="np-button" id="help">H · ?</button><button class="np-button" id="toggle-ai-space" aria-controls="ai-space" data-i18n="aiSpace"></button>
    <button id="retry-save" class="np-button" data-i18n="retrySave" hidden></button><span id="save-indicator" class="np-meta" role="status" aria-live="polite"></span><span class="version sr-only">v0.2.0</span>
  </header>
  <main class="spaces">
    <aside id="myspace" class="side np-scroll" tabindex="0" aria-label="MySpace">
      <h2 data-i18n="myspace"></h2><p class="np-meta" data-i18n="myHint"></p><div id="retained"></div>
      <div id="projects-panel"></div><button id="history" class="np-button" data-i18n="history"></button><p id="storage-status" role="status" aria-live="polite" class="np-meta"></p>
    </aside>
    <section class="workspace" aria-label="Workspace">
      <div class="viewport" id="viewport">
        <div id="canvas-scroll" class="np-scroll" tabindex="0" aria-label="Dokument / Document">
          <div id="canvas-sizer"><div id="canvas" role="group" aria-label="Boxen / Boxes"></div></div>
        </div>

      </div>
      <p id="status" role="status" aria-live="polite" class="np-notice"></p>

    </section>
    <aside id="ai-space" class="side np-scroll" tabindex="0" aria-label="KI-Space / AI-Space">
      <h2 data-i18n="aiSpace"></h2><p id="connection" role="status" class="np-meta"></p>
      <form id="ai-form"><p id="reply-context" class="np-meta" role="status" hidden></p><label class="np-field"><span data-i18n="order"></span><textarea rows="1" id="order" maxlength="1000" data-placeholder="orderPlaceholder"></textarea></label><button id="send" type="submit" class="np-button" data-variant="primary" data-i18n="send"></button></form>
      <div id="tasks"></div>
      <details class="np-disclosure" id="selection-panel"><summary data-i18n="selection"></summary>
        <div id="selection-info" class="np-meta"></div>
        <label class="np-field"><span data-i18n="type"></span><input id="box-type" list="types" maxlength="80"><datalist id="types"></datalist></label>
        <label class="np-field"><span data-i18n="label"></span><textarea id="box-label" maxlength="4000"></textarea></label>
        <label class="np-field"><span data-i18n="parent"></span><select id="box-parent"></select></label>
        <div class="selection-actions"><button id="transfer" class="np-button" data-i18n="transfer"></button><button id="group" class="np-button" data-i18n="group"></button></div>
      </details>
      <details class="np-disclosure" id="attribute-panel"><summary data-i18n="attributeTitle"></summary>
        <div id="palette" role="group" aria-label="16 Grundfarben / 16 base colours"></div><p id="preview-info" role="status"></p>
      </details>
    </aside>
  </main>
        <section id="monitor" aria-label="Werte-Monitor / Value monitor">
          <div id="monitor-handle" tabindex="0"><strong data-i18n="monitor"></strong><span class="np-meta" data-i18n="monitorHint"></span></div>
          <div id="monitor-values"></div>
        </section>
</div>
<dialog id="help-dialog" aria-labelledby="help-title" class="np-scroll">
  <h2 id="help-title" data-i18n="helpTitle"></h2>
  <div id="shortcut-list"></div><p data-i18n="virtual"></p><p data-i18n="helpAI"></p><p data-i18n="helpLimits"></p><p data-i18n="backupLimit"></p>
  <button class="np-button" id="close-help" data-i18n="close"></button>
</dialog>
<dialog id="history-dialog" class="np-scroll" aria-labelledby="history-title"><h2 id="history-title" data-i18n="history"></h2><p data-i18n="backupLimit"></p><div id="history-list" class="np-scroll" tabindex="0" aria-label="Snapshots"></div><div id="history-inspect" tabindex="0" class="np-scroll"></div><button id="close-history" class="np-button" data-i18n="close"></button></dialog>
<script type="module" src="/src/app.js"></script>
</body></html>
