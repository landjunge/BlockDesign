<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Designer</title>
  <link rel="stylesheet" href="/styles/networkpunkt.css"><link rel="stylesheet" href="/styles/blockdesigner.css">
</head>
<body class="np-ui np-scroll">
<div class="app np-desktop">
  <header class="topbar">
    <h1>Block <span class="brand">Designer</span></h1><p data-i18n="intro"></p>
    <span class="version np-meta">v0.1.0</span>
    <label class="np-field language"><span class="sr-only" data-i18n="language"></span><select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
    <button class="np-button" id="help" data-i18n="help"></button>
  </header>
  <main class="spaces">
    <aside id="myspace" class="side np-scroll" tabindex="0" aria-label="MySpace">
      <h2 data-i18n="myspace"></h2><p class="np-meta" data-i18n="myHint"></p><div id="retained"></div>
      <p class="np-meta" data-i18n="sessionOnly"></p>
    </aside>
    <section class="workspace" aria-label="Workspace">
      <div class="workspace-head"><h2 data-i18n="workspace"></h2><span class="np-meta" data-i18n="documentInfo"></span></div>
      <div class="workspace-toolbar">
        <div class="np-actions" id="layers" role="group" aria-label="Ebenen / Layers">
          <button class="np-button" data-layer="1">1</button><button class="np-button" data-layer="2">2</button><button class="np-button" data-layer="3">3</button>
        </div>
        <div class="np-actions" role="group" aria-label="Ansicht / View">
          <button class="np-button" data-view="structure" data-i18n="structure"></button><button class="np-button" data-view="design" data-i18n="design"></button>
        </div>
        <label class="np-field zoom"><span class="sr-only" data-i18n="zoom"></span><select id="zoom"><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75" selected>75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
      </div>
      <div class="gridbar"><button id="grid-toggle" class="np-button" data-i18n="grid"></button><span id="grid-info" class="np-meta"></span><button class="np-button" id="refine" data-i18n="refine"></button></div>
      <div class="viewport" id="viewport">
        <div id="canvas-scroll" class="np-scroll" tabindex="0" aria-label="Dokument / Document">
          <div id="canvas-sizer"><div id="canvas" role="group" aria-label="Boxen / Boxes"></div></div>
        </div>
        <section id="monitor" aria-label="Werte-Monitor / Value monitor">
          <div id="monitor-handle" tabindex="0"><strong data-i18n="monitor"></strong><span class="np-meta" data-i18n="monitorHint"></span></div>
          <div id="monitor-values"></div>
        </section>
      </div>
      <p id="status" role="status" aria-live="polite" class="np-notice"></p>
      <p class="np-meta footer-hint"><span data-i18n="createHint"></span><br><span data-i18n="virtual"></span></p>
    </section>
    <aside id="ai-space" class="side np-scroll" tabindex="0" aria-label="KI-Space / AI-Space">
      <h2 data-i18n="aiSpace"></h2><p data-i18n="aiHint"></p><p id="connection" role="status" class="np-meta"></p>
      <form id="ai-form"><label class="np-field"><span data-i18n="order"></span><textarea id="order" maxlength="1000" data-placeholder="orderPlaceholder"></textarea></label><button id="send" type="submit" class="np-button" data-variant="primary" data-i18n="send"></button></form>
      <div id="tasks"></div>
      <details class="np-disclosure" id="selection-panel"><summary data-i18n="selection"></summary>
        <div id="selection-info" class="np-meta"></div>
        <label class="np-field"><span data-i18n="type"></span><input id="box-type" list="types" maxlength="80"><datalist id="types"></datalist></label>
        <label class="np-field"><span data-i18n="label"></span><textarea id="box-label" maxlength="4000"></textarea></label>
        <label class="np-field"><span data-i18n="parent"></span><select id="box-parent"></select></label>
        <div class="selection-actions"><button id="transfer" class="np-button" data-i18n="transfer"></button><button id="group" class="np-button" data-i18n="group"></button></div>
      </details>
      <details class="np-disclosure" id="attribute-panel"><summary data-i18n="attributeTitle"></summary>
        <p class="np-meta" data-i18n="attributeHint"></p><div id="palette" role="group" aria-label="16 Grundfarben / 16 base colours"></div><p id="preview-info" role="status"></p>
      </details>
    </aside>
  </main>
</div>
<dialog id="help-dialog" aria-labelledby="help-title" class="np-scroll">
  <h2 id="help-title" data-i18n="helpTitle"></h2>
  <p data-i18n="helpFlow"></p><p data-i18n="helpMove"></p><p data-i18n="helpSize"></p><p data-i18n="helpSelect"></p><p data-i18n="attributeHint"></p><p data-i18n="helpAI"></p><p data-i18n="helpLimits"></p>
  <button class="np-button" id="close-help" data-i18n="close"></button>
</dialog>
<script type="module" src="/src/app.js"></script>
</body></html>
